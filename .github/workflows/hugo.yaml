name: Build and publish Wilna Hugo site

on:
  push:
    branches:
      - codex/github-pages-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wilna-pages-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hugo source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true

      - name: Build production website
        run: hugo --minify --buildFuture --cleanDestinationDir

      - name: Audit generated internal links and assets
        run: python3 scripts/audit-links.py public

      - name: Checkout static Pages branch
        uses: actions/checkout@v4
        with:
          ref: codex/github-pages-fix
          path: _pages_checkout
          fetch-depth: 1

      - name: Synchronize generated website to static Pages branch
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' public/ _pages_checkout/
          git -C _pages_checkout config user.name 'github-actions[bot]'
          git -C _pages_checkout config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C _pages_checkout add -A
          if git -C _pages_checkout diff --cached --quiet; then
            echo 'Pages branch is already up to date'
          else
            git -C _pages_checkout commit -m "Publish Hugo build from ${GITHUB_SHA}"
            git -C _pages_checkout push origin HEAD:codex/github-pages-fix
          fi
