{{ define "main" }}
{{ $ui := index .Site.Data.ui .Lang }}
<header class="page-heading"><div class="site-container"><p class="eyebrow">News &amp; updates</p><h1>{{ $ui.news }}</h1><p>{{ .Description }}</p></div></header>
<section class="section" aria-labelledby="latest-updates"><div class="site-container"><h2 class="sr-only" id="latest-updates">{{ $ui.news }}</h2>{{ partial "news-feed.html" (dict "page" .) }}</div></section>
{{ end }}
