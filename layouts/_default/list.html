{{ define "main" }}
  <header class="page-heading">
    <div class="site-container"><p class="eyebrow">Wilna Lab</p><h1>{{ .Title }}</h1></div>
  </header>
  <section class="section section--soft">
    <div class="site-container news-grid">
      {{ range .Pages.ByDate.Reverse }}
        <article class="news-card">
          {{ if gt .Date.Year 1 }}<div class="news-card__meta">{{ .Date.Year }}</div>{{ end }}
          <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
          <a class="card-link" href="{{ .RelPermalink }}">{{ $.Site.Params.learnMore }} →</a>
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
