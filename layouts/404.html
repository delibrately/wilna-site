{{ define "main" }}
  <section class="profile">
    <div class="site-container detail-layout">
      <p class="eyebrow">404</p>
      <h1>{{ if eq .Lang "zh" }}页面没有找到{{ else }}Page not found{{ end }}</h1>
      <p>{{ if eq .Lang "zh" }}这个链接可能已失效，返回首页继续浏览。{{ else }}This link may be outdated. Return home to continue browsing.{{ end }}</p>
      <div class="button-row"><a class="button button--primary" href="{{ .Site.Home.RelPermalink }}">{{ if eq .Lang "zh" }}返回首页{{ else }}Back home{{ end }}</a></div>
    </div>
  </section>
{{ end }}
