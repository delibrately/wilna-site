      content = "欢迎自学能力强、对该研究方向感兴趣的本科生加入WiLNA。"


    [[languages.zh.menu.main]]
        name = "首页"
        pageRef = "/"
        weight = 1

    [[languages.zh.menu.main]]
        name = "研究方向"
