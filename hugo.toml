baseURL = "https://delibrately.github.io/wilna-site/"
title = "WiLNA"
theme = "blist"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true

# Keep URLs rooted at the GitHub Pages project path from baseURL.
canonifyURLs = false
relativeURLs = false

[languages]
  [languages.en]
    contentDir = "content/en"
    weight = 2
    languageName = "English"
    [languages.en.params]
      news = "News"
      heroEyebrow = "Dalian University of Technology"
      heroTitle = "WiLNA"
      heroDescription = "For real-world settings such as marine operations and industrial sites, we study multimodal sensing, communications and networks, collaborative edge intelligence, and the autonomous operation of physical AI systems."
      heroPrimary = "Explore research"
      heroSecondary = "Meet the team"
      latestNews = "Latest publications"
      latestNewsDescription = "Recent work from our team across sensing, networking, and intelligent systems."
      researchTitle = "Research directions"
      researchDescription = "Multimodal sensing, communications and networks, collaborative edge intelligence, and physical AI systems."
      viewAll = "View all"
      learnMore = "Learn more"
      advisors = "Faculty"
      members = "Students and alumni"
      publications = "Publications"
      abstract = "Abstract"
      bibtex = "BibTeX"
      contactTitle = "Work with us"
      contactDescription = "We welcome motivated students and research collaborators."
      contactAction = "Contact the lab"

    [[languages.en.params.about]]
      content = "We are a research lab of WiLNA, led by Prof. Lei Wang."

    [[languages.en.params.about]]
      content = "Our research spans wireless sensing, acoustic intelligence, Internet of Things, and networked systems."

    [[languages.en.params.about]]
      content = "Undergraduate students who are highly self-motivated, and interested in this research direction, are welcome to join our WiLNA lab (contact: lei.wang@dlut.edu.cn)"

    [[languages.en.menu.main]]
        name = "Home"
        pageRef = "/"
        weight = 1
    [[languages.en.menu.main]]
        name = "Research"
        pageRef = "/research"
        weight = 2

    [[languages.en.menu.main]]
        name = "People"
        pageRef = "/people"
        weight = 3

    [[languages.en.menu.main]]
        name = "Publications"
        pageRef = "/papers"
        weight = 4

    [[languages.en.menu.main]]
        name = "News"
        pageRef = "/news"
        weight = 5

    [[languages.en.menu.main]]
        name = "Join us"
        pageRef = "/joinus"
        weight = 6


  [languages.zh]
    contentDir = "content/zh"
    weight = 1
    languageName = "中文"
    [languages.zh.params]
      news = "新闻"
      heroEyebrow = "大连理工大学"
      heroTitle = "WiLNA"
      heroDescription = "面向海洋作业与工业现场等真实场景，研究多模态感知、通信与网络、协同边缘智能，及物理AI系统的自主运行。"
      heroPrimary = "了解研究方向"
      heroSecondary = "认识团队成员"
      latestNews = "最新成果"
      latestNewsDescription = "聚焦无线感知、网络系统与智能计算的近期研究工作。"
      researchTitle = "研究方向"
      researchDescription = "多模态感知、通信与网络、协同边缘智能、物理AI系统。"
      viewAll = "查看全部"
      learnMore = "了解更多"
      advisors = "指导教师"
      members = "学生与校友"
      publications = "论文成果"
      abstract = "摘要"
      bibtex = "BibTeX"
      contactTitle = "加入与合作"
      contactDescription = "欢迎对相关方向感兴趣的同学和研究伙伴与我们联系。"
      contactAction = "联系实验室"
      homepage.social.title = "联系我们团队"
      homepage.social.description = "如果你对我们WiLNA团队感兴趣，欢迎联系我们！"

    [[languages.zh.params.about]]
      content = "我们是一个由王雷教授领导的WiLNA研究实验室。"
    [[languages.zh.params.about]]
      content = "我们聚焦无线感知、声学智能、物联网与网络化系统。"
